name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript version
        run: |
          pnpm exec tsc --version
          pnpm exec tsc --version | grep '^Version 7\.'

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck auth-core
        run: pnpm --filter @gasboost/auth typecheck

      - name: Test auth-core
        run: pnpm --filter @gasboost/auth test

      - name: Build auth-core
        run: pnpm --filter @gasboost/auth build

      - name: Typecheck auth-app
        run: pnpm --filter @gasboost/auth-app typecheck

      - name: Test auth-app
        run: pnpm --filter @gasboost/auth-app test

      - name: Build auth-app
        run: pnpm --filter @gasboost/auth-app build

      - name: Typecheck auth-sheetorm
        run: pnpm --filter @gasboost/auth-sheetorm typecheck

      - name: Test auth-sheetorm
        run: pnpm --filter @gasboost/auth-sheetorm test

      - name: Build auth-sheetorm
        run: pnpm --filter @gasboost/auth-sheetorm build

      - name: Typecheck auth-realtime-firebase
        run: pnpm --filter @gasboost/auth-realtime-firebase typecheck

      - name: Test auth-realtime-firebase
        run: pnpm --filter @gasboost/auth-realtime-firebase test

      - name: Build auth-realtime-firebase
        run: pnpm --filter @gasboost/auth-realtime-firebase build

      - name: Verify packed packages
        run: pnpm pack:check
